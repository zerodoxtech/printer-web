<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --zx-light: #1E9CD8;
      --zx-royal: #4664AE;
      --zx-navy: #263D7D;
      --zx-bg: #F5F7FB;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      width: 320px; margin: 0; background: var(--zx-bg);
    }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--zx-navy) 0%, var(--zx-royal) 70%, var(--zx-light) 130%);
    }
    header img { width: 28px; height: 28px; }
    header .titulo {
      color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 2px;
    }
    header .titulo span { font-weight: 300; opacity: .85; letter-spacing: 0; font-size: 11px; display: block; }
    main { padding: 16px; }
    .card {
      background: #fff; border-radius: 12px; padding: 14px;
      box-shadow: 0 1px 4px rgba(38, 61, 125, .12);
    }
    #status {
      font-size: 12.5px; color: #4a5568; margin: 0 0 12px;
      word-break: break-word; line-height: 1.45;
    }
    #status b { color: var(--zx-navy); }
    .badge {
      display: inline-block; font-size: 10.5px; font-weight: 700;
      padding: 2px 8px; border-radius: 99px; margin-bottom: 8px;
      letter-spacing: .5px;
    }
    .badge.pdf  { background: #E3F3FB; color: #0B6FA3; }
    .badge.html { background: #EDF0FA; color: var(--zx-royal); }
    .orientacao {
      margin: 0 0 12px;
    }
    .orientacao .rotulo {
      font-size: 11.5px; color: #4a5568; font-weight: 600;
      margin-bottom: 6px; letter-spacing: .3px;
    }
    .segmentado {
      display: flex; background: #EDF0FA; border-radius: 8px; padding: 3px;
      gap: 3px;
    }
    .segmentado button.opcao {
      flex: 1; padding: 7px 6px; font-size: 12.5px; font-weight: 600;
      border-radius: 6px; border: none; cursor: pointer;
      background: transparent; color: var(--zx-royal);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .segmentado button.opcao.ativo {
      background: #fff; color: var(--zx-navy);
      box-shadow: 0 1px 3px rgba(38, 61, 125, .25);
    }
    .segmentado button.opcao svg { flex: none; }
    button {
      width: 100%; padding: 11px; font-size: 13.5px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; color: #fff;
      background: linear-gradient(135deg, var(--zx-royal), var(--zx-navy));
      transition: filter .15s, transform .05s;
    }
    button:hover:not(:disabled) { filter: brightness(1.12); }
    button:active:not(:disabled) { transform: scale(.985); }
    button:disabled { background: #C3CBDD; cursor: default; }
    #resultado { font-size: 12px; margin-top: 10px; line-height: 1.4; }
    .ok { color: #188038; }
    .erro { color: #d93025; }
    footer {
      display: flex; justify-content: flex-end; padding: 0 16px 12px;
    }
    footer a {
      font-size: 11.5px; color: var(--zx-royal); text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
    .spinner {
      display: inline-block; width: 12px; height: 12px; vertical-align: -2px;
      border: 2px solid #C3CBDD; border-top-color: var(--zx-royal);
      border-radius: 50%; animation: gira .7s linear infinite; margin-right: 6px;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div class="titulo">ZERODOX<span>Printer Web</span></div>
  </header>
  <main>
    <div class="card">
      <span id="badge" class="badge" hidden></span>
      <p id="status"><span class="spinner"></span>Analisando esta aba...</p>

      <div id="orientacao" class="orientacao" hidden>
        <div class="rotulo">Orientação do PDF</div>
        <div class="segmentado">
          <button type="button" class="opcao ativo" id="opRetrato" data-valor="retrato">
            <svg width="10" height="13" viewBox="0 0 10 13"><rect x="0.5" y="0.5" width="9" height="12" rx="1.5" fill="none" stroke="currentColor"/></svg>
            Retrato
          </button>
          <button type="button" class="opcao" id="opPaisagem" data-valor="paisagem">
            <svg width="13" height="10" viewBox="0 0 13 10"><rect x="0.5" y="0.5" width="12" height="9" rx="1.5" fill="none" stroke="currentColor"/></svg>
            Paisagem
          </button>
        </div>
      </div>

      <button id="acao" disabled>Aguarde...</button>
      <div id="resultado"></div>
    </div>
  </main>
  <footer>
    <a href="#" id="opcoes">Configurações</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
